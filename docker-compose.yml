# The RAG, served from a small server.
#
#   mcp     serves search_vault / list_recent_captures over Streamable HTTP.
#
# Embedding the *question* (bge-m3, 0.22 s warm) is done by a shared Ollama
# that lives in its own Coolify service ("embeddings", alias
# `embeddings-ollama` on the `rag-net` network). It moved out of this compose
# on 3 Sep 2026 so Paperless and other consumers can share the same embedder,
# and so a redeploy here never restarts it. Generation never happens on this
# box: on a CPU-only host it was measured at 138-217 s per answer, so the
# chat frontend talks to a hosted model instead.
#
# The service publishes no port. It is reachable only from inside its private
# Docker networks, which keeps this off the public internet by construction
# rather than by firewall rule.

services:
  mcp:
    build: .
    restart: unless-stopped
    environment:
      # The shared embedder. Override to point at a local `ollama serve`.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://embeddings-ollama:11434}
      RAG_PROVIDER: ollama
      # Must match the embedder the index was built with, or retrieve() refuses
      # to answer (vectors from different models are not comparable).
      RAG_EMBED_MODEL: bge-m3
      RAG_INDEX: /indexes/karakeep.json
      # DNS-rebinding allowlist: the service name the client will use.
      MCP_ALLOWED_HOSTS: mcp:8770
    volumes:
      # Read-only: the container serves the index, whoever builds it writes it.
      # Absolute by default so it does not depend on where the orchestrator
      # checks the project out. Override with INDEX_DIR.
      - ${INDEX_DIR:-/opt/personal-rag/indexes}:/indexes:ro
    mem_limit: 512m
    networks:
      # `rag` is the shared network: the chat frontend joins it to resolve
      # http://mcp:8770/mcp, and the embeddings service joins it so this
      # container can resolve embeddings-ollama. Declared here so a redeploy
      # does not drop the attachment.
      - default
      - rag
    healthcheck:
      # 127.0.0.1, not "localhost": on Alpine that resolves to ::1 and the
      # check fails with connection refused, which triggers a rollback loop.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8770/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  # Created out of band, shared with the chat frontend and the embeddings
  # service:
  #   docker network create rag-net
  rag:
    external: true
    name: rag-net
