# The RAG, served from a small server.
#
#   ollama  embeds the *question* only (bge-m3, 0.22 s warm). Generation never
#           happens here: on a CPU-only box it was measured at 138-217 s per
#           answer, so the chat frontend talks to a hosted model instead.
#   mcp     serves search_vault / list_recent_captures over Streamable HTTP.
#
# Neither service publishes a port. They are reachable only from inside their
# private Docker network, which keeps this off the public internet by
# construction rather than by firewall rule.
#
# mem_limit on both: ollama is exactly the container that needs it.

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Unload the model between questions; only bge-m3 (1.14 GB) ever loads.
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama-models:/root/.ollama
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  mcp:
    build: .
    restart: unless-stopped
    environment:
      OLLAMA_HOST: http://ollama:11434
      RAG_PROVIDER: ollama
      # Must match the embedder the index was built with, or retrieve() refuses
      # to answer (vectors from different models are not comparable).
      RAG_EMBED_MODEL: bge-m3
      RAG_INDEX: /indexes/karakeep.json
      # DNS-rebinding allowlist: the service name the client will use.
      MCP_ALLOWED_HOSTS: mcp:8770
    volumes:
      # Read-only: the container serves the index, whoever builds it writes it.
      # Absolute by default so it does not depend on where the orchestrator
      # checks the project out. Override with INDEX_DIR.
      - ${INDEX_DIR:-/opt/personal-rag/indexes}:/indexes:ro
    mem_limit: 512m
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      # `default` keeps ollama reachable; `rag` is the shared network the chat
      # frontend joins, so it can resolve http://mcp:8770/mcp. Declared here so
      # a redeploy does not drop the attachment.
      - default
      - rag
    healthcheck:
      # 127.0.0.1, not "localhost": on Alpine that resolves to ::1 and the
      # check fails with connection refused, which triggers a rollback loop.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8770/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ollama-models:

networks:
  # Created out of band, shared with the chat frontend:
  #   docker network create rag-net
  rag:
    external: true
    name: rag-net
